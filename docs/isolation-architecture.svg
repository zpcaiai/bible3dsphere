<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa3b2"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34c759"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="#0f1220"/>
  <text x="490" y="34" fill="#e6e9f2" font-size="20" font-weight="700" text-anchor="middle">属灵星球 · B12 多租户隔离架构</text>
  <text x="490" y="56" fill="#7f8aa3" font-size="12" text-anchor="middle">个人成长数据 email 私有(永不 org 可见) · 社区数据 org_id 作用域 + RBAC · 危机/安全永远豁免</text>

  <!-- top -->
  <rect x="400" y="74" width="180" height="40" rx="9" fill="#1b2030" stroke="#2c3450"/>
  <text x="490" y="99" fill="#e6e9f2" font-size="13" text-anchor="middle">用户 (email)</text>
  <line x1="490" y1="114" x2="490" y2="140" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="400" y="140" width="180" height="40" rx="9" fill="#1b2030" stroke="#2c3450"/>
  <text x="490" y="165" fill="#e6e9f2" font-size="13" text-anchor="middle">FastAPI routers</text>

  <!-- domains -->
  <rect x="70" y="226" width="250" height="48" rx="9" fill="#16241b" stroke="#2e7d4f"/>
  <text x="195" y="246" fill="#cfeede" font-size="13" font-weight="600" text-anchor="middle">个人成长域</text>
  <text x="195" y="264" fill="#9bbfa9" font-size="10.5" text-anchor="middle">examen / confession / crisis / prayer / memory</text>

  <rect x="660" y="226" width="250" height="48" rx="9" fill="#14202e" stroke="#3a6e93"/>
  <text x="785" y="246" fill="#cfe6f7" font-size="13" font-weight="600" text-anchor="middle">社区 · 组织域</text>
  <text x="785" y="264" fill="#9bc0d9" font-size="10.5" text-anchor="middle">groups / mentor / discipleship / church</text>

  <path d="M440 180 L210 226" stroke="#9aa3b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M540 180 L770 226" stroke="#9aa3b2" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- data stores -->
  <rect x="70" y="316" width="250" height="56" rx="9" fill="#16241b" stroke="#2e7d4f"/>
  <text x="195" y="340" fill="#cfeede" font-size="13" font-weight="600" text-anchor="middle">个人数据(无 org_id)</text>
  <text x="195" y="358" fill="#9bbfa9" font-size="10.5" text-anchor="middle">email 私有 · 组织/牧者永不可见</text>

  <rect x="660" y="316" width="250" height="56" rx="9" fill="#14202e" stroke="#3a6e93"/>
  <text x="785" y="340" fill="#cfe6f7" font-size="13" font-weight="600" text-anchor="middle">社区数据(org_id 作用域)</text>
  <text x="785" y="358" fill="#9bc0d9" font-size="10.5" text-anchor="middle">create-with-org 盖 org_id</text>

  <line x1="195" y1="274" x2="195" y2="316" stroke="#34c759" stroke-width="1.5" marker-end="url(#arrGrn)"/>
  <line x1="785" y1="274" x2="785" y2="316" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- tenancy gate -->
  <rect x="330" y="250" width="320" height="60" rx="10" fill="#1d1733" stroke="#8b5cf6"/>
  <text x="490" y="274" fill="#d8ccff" font-size="13" font-weight="700" text-anchor="middle">core/tenancy 强制层(单一事实来源)</text>
  <text x="490" y="294" fill="#b3a4e6" font-size="10.5" text-anchor="middle">require_org_permission(RBAC+成员→403) · PRIVATE_PERSONAL_DOMAINS</text>

  <!-- org console -->
  <line x1="490" y1="310" x2="490" y2="392" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350" y="392" width="280" height="56" rx="10" fill="#1b2030" stroke="#3a6e93"/>
  <text x="490" y="416" fill="#e6e9f2" font-size="13" font-weight="600" text-anchor="middle">org_console /api/org-console</text>
  <text x="490" y="434" fill="#9bc0d9" font-size="10.5" text-anchor="middle">11 端点 · 只读计数 · 跨组织不可见</text>

  <!-- allowed: org_console -> community data -->
  <path d="M630 408 C 720 400, 760 380, 785 372" stroke="#34c759" stroke-width="1.8" fill="none" marker-end="url(#arrGrn)"/>
  <text x="712" y="392" fill="#7fd79a" font-size="10" text-anchor="middle">RBAC + WHERE org_id=%s</text>

  <!-- forbidden: org_console -.-> personal data -->
  <path d="M350 408 C 260 400, 220 380, 195 372" stroke="#ff6b6b" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrRed)"/>
  <text x="262" y="392" fill="#ff9a9a" font-size="10" text-anchor="middle">✗ assert_not_personal_domain</text>

  <!-- bottom row -->
  <rect x="60" y="500" width="280" height="76" rx="10" fill="#1b2030" stroke="#2c3450"/>
  <text x="200" y="524" fill="#e6e9f2" font-size="12.5" font-weight="600" text-anchor="middle">platform_admin /api/platform</text>
  <text x="200" y="542" fill="#9aa3b2" font-size="10.5" text-anchor="middle">仅 platform_admins · suspend/reactivate</text>
  <text x="200" y="560" fill="#9aa3b2" font-size="10.5" text-anchor="middle">crisis 队列 / 审核日志(仅元数据,无正文)</text>

  <rect x="360" y="500" width="260" height="76" rx="10" fill="#1b2030" stroke="#2c3450"/>
  <text x="490" y="524" fill="#e6e9f2" font-size="12.5" font-weight="600" text-anchor="middle">billing /api/billing</text>
  <text x="490" y="542" fill="#9aa3b2" font-size="10.5" text-anchor="middle">Stripe webhook → subscriptions</text>
  <text x="490" y="560" fill="#9aa3b2" font-size="10.5" text-anchor="middle">与隔离解耦 · 未配置则优雅降级</text>

  <rect x="640" y="500" width="290" height="76" rx="10" fill="#241620" stroke="#a3415e"/>
  <text x="785" y="524" fill="#ffd6e0" font-size="12.5" font-weight="700" text-anchor="middle">危机 / 安全</text>
  <text x="785" y="542" fill="#e0a9b8" font-size="10.5" text-anchor="middle">safety_exception:永远豁免订阅与租户</text>
  <text x="785" y="560" fill="#e0a9b8" font-size="10.5" text-anchor="middle">订阅过期 / 组织停用都不影响</text>

  <text x="490" y="616" fill="#6f7a93" font-size="10.5" text-anchor="middle">绿色实线 = 允许的数据流 · 红色虚线 = 被强制层禁止(个人域永不进 org_console)</text>
  <text x="490" y="634" fill="#566080" font-size="10" text-anchor="middle">守卫:b12_smoke.py(40 条) + 契约测试(org_console 11 / church 5 / billing 5 / platform 4)</text>
</svg>
