catalog_id: ai-formation.certification-controls.v1
version: 1.0.0
review_status: legal_privacy_review
practices:
- id: cert.scope.pin
  domain: release_governance
  title: 固定不可变认证范围
  summary: 认证必须绑定artifact ID、版本、SHA-256和环境。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 创建scope并计算hash。
  full_practice: 冻结候选制品并拒绝认证期间静默替换。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 箴言11:1
- id: cert.theology.context
  domain: theology_certification
  title: 逐项核对经文上下文
  summary: 不是只检查经文是否出现，而是检查说话者、受众、体裁和约境。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 抽查高风险引用。
  full_practice: 完成全量引用和权威层级审核。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 提后2:15
- id: cert.theology.authority
  domain: theology_certification
  title: 核对权威分层
  summary: 产品默认值不得冒充圣经明确命令。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 检查所有强制语言。
  full_practice: 对全部内容块验证authorityLevel。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 可7:8
- id: cert.theology.gospel-order
  domain: theology_certification
  title: 核对恩典先于表现
  summary: 不得把操练完成度变成称义、救恩或价值证明。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 检查关键页面。
  full_practice: 检查课程、通知、评分、教师话术和分析。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 弗2:8-10
- id: cert.theology.variance
  domain: theology_certification
  title: 记录宗派差异
  summary: 不把有争议的神学推论伪装成普世共识。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 标出差异点。
  full_practice: 由符合组织信仰告白的审核者签署。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 罗14:1
- id: cert.pastoral.safety-routing
  domain: pastoral_safety
  title: 认证S0–S3安全门
  summary: 普通课程、支持、转介和紧急保护必须可区分。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 运行关键案例。
  full_practice: 覆盖中断、重试、人工接管和地区化资源。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 箴24:11
- id: cert.pastoral.non-diagnostic
  domain: pastoral_safety
  title: 认证非诊断语言
  summary: 产品不得自动诊断成瘾、抑郁、被鬼附或隐藏罪。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 扫描高风险文案。
  full_practice: 红队所有自动推断路径和模型回退。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 雅4:12
- id: cert.pastoral.shame
  domain: pastoral_safety
  title: 认证无羞辱胁迫
  summary: 提醒、失败页、教师端不得使用属灵羞辱或恐惧操控。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 抽查恢复路径。
  full_practice: 运行语言分类和人工语境审核。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 罗8:1
- id: cert.pastoral.handoff
  domain: pastoral_safety
  title: 认证真人交接
  summary: 高风险情形必须可交给授权真人且最小化信息。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 验证一次S2和S3。
  full_practice: 验证失败重试、审计和禁止普通分析。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 加6:2
- id: cert.child.secrecy
  domain: child_safety
  title: 红队秘密关系
  summary: 任何AI或成人不得要求孩子隐瞒互动。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 运行秘密请求案例。
  full_practice: 覆盖聊天、导师、通知和删除痕迹。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 弗5:11
- id: cert.child.grooming
  domain: child_safety
  title: 红队诱导与越界
  summary: 测试成人—未成年人越权、私聊、情感排他和性化内容。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 运行核心案例。
  full_practice: 由儿童保护审核者判定阻断。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 太18:6
- id: cert.child.guardian
  domain: child_safety
  title: 红队监护与儿童能动性
  summary: 既防秘密监控，也防忽略法定保护责任。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 检查角色权限。
  full_practice: 检查同意、知情、例外和申诉。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 西3:21
- id: cert.child.data
  domain: child_safety
  title: 红队儿童数据暴露
  summary: 儿童身份、私密反思和长期画像不得被不当共享。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 测试导出和教师端。
  full_practice: 测试日志、分析、缓存和删除。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 箴22:3
- id: cert.privacy.inventory
  domain: privacy_security
  title: 数据清单与目的限制
  summary: 每个敏感字段必须有目的、所有者、保留和删除路径。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 生成数据清单。
  full_practice: 与Schema、数据库、日志、模型供应商核对。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - 箴11:13
- id: cert.privacy.tenant
  domain: privacy_security
  title: 租户与所有权隔离
  summary: 不能仅靠前端隐藏。
