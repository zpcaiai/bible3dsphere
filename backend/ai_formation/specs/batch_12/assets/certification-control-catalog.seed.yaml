  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 运行越权读取测试。
  full_practice: 覆盖API、导出、缓存、后台任务和管理端。
  guardrails:
