course_id: ai-formation.production-certification.v1
version: 1.0.0
review_status: theology_review
units:
- id: u12.01
  title: 认证范围与证据完整性
  lessons:
  - id: l12.01.01
    title: 为何认证必须绑定不可变制品
    objective: 理解版本、hash、环境和真实执行证据。
    practice_ids:
    - cert.scope.pin
    - cert.evidence.command
    scripture_anchors:
    - 箴11:1
    activity: 为候选制品建立认证scope。
    review_status: theology_review
  - id: l12.01.02
    title: 从声明回到证据
    objective: 避免把静态包校验夸大为生产认证。
    practice_ids:
    - cert.evidence.claim
    scripture_anchors:
    - 申19:15
    activity: 给每条发布声明附证据与限制。
    review_status: theology_review
  - id: l12.01.03
    title: 人类发布责任
    objective: 明确自动化与最终责任的界线。
    practice_ids:
    - cert.release.human
    scripture_anchors:
    - 雅3:1
    activity: 模拟批准、有限发布和拒绝。
    review_status: theology_review
  review_status: theology_review
- id: u12.02
