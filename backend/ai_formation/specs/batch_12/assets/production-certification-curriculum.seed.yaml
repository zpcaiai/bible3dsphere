    review_status: theology_review
  - id: l12.02.02
    title: 权威分层与恩典次序
    objective: 区分圣经、推论、智慧和产品默认。
    practice_ids:
    - cert.theology.authority
    - cert.theology.gospel-order
    scripture_anchors:
    - 可7:8
    - 弗2:8-10
    activity: 审查强制性文案和评分。
    review_status: theology_review
  - id: l12.02.03
    title: 宗派差异与签署范围
    objective: 记录组织信仰告白与争议点。
    practice_ids:
    - cert.theology.variance
    scripture_anchors:
    - 罗14:1
