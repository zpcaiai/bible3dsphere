  - id: l12.04.02
    title: 监护、能动性和数据
    objective: 同时防止忽视保护与秘密监控。
    practice_ids:
    - cert.child.guardian
    - cert.child.data
    scripture_anchors:
    - 西3:21
    - 箴22:3
