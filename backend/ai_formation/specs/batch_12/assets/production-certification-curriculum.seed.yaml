  - id: l12.03.02
    title: 非诊断与无羞辱
    objective: 识别自动诊断、定罪和恐惧操控。
    practice_ids:
    - cert.pastoral.non-diagnostic
    - cert.pastoral.shame
    scripture_anchors:
    - 雅4:12
    - 罗8:1
    activity: 审查失败页与提醒。
    review_status: theology_review
  review_status: theology_review
- id: u12.04
