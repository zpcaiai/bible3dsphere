schema_version: 1.0.0
batch: 12
allowed_events:
- certification_scope_created
- gate_started
- gate_completed_coarse
- release_decision_recorded
- rollback_exercised
allowed_dimensions:
- tenant_id_pseudonymous
- module_key
- batch
- route_key
- age_band_coarse
- content_version
- review_state
- safety_level_coarse
- feature_flag_variant
- completion_state
- error_code_non_sensitive
denylisted_fields:
- confession
- contact_details
- evidence_log_content
- exact_message_content
- explicit_content
- finding_detail
- full_browsing_history
- health_detail
- minor_identity
- participant_outcome_detail
- pastoral_narrative
- precise_location
- private_reflection
- raw_ai_answer
- raw_prompt
- red_team_transcript
- reviewer_private_note
- sexual_history
- third_party_identity
rules:
- analytics must be allowlist-based
- S2/S3 narratives never enter product analytics
- free text requires redaction or is excluded
- minor events use coarse age bands and pseudonymous identifiers only
