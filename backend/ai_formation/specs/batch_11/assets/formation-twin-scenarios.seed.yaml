scenario_set_id: ai-formation.twin-scenarios.v1
version: 1.0.0
scenarios:
- id: scenario.twin.sparse-data
  title: 数据稀少却给出强结论
  audience:
  - teacher
  - adult
  trigger: 只有两次Check-in，系统拟判断长期下降。
  formation_tension: 效率与证据谦卑之间。
  safe_outcomes:
  - insufficient_data
  - 低置信
  - 替代解释
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.streak-shame
  title: 中断连续打卡后羞耻
  audience:
  - adult
  - older_teen
  trigger: 用户错过一天后系统显示失败。
  formation_tension: 坚持与streak崇拜之间。
  safe_outcomes:
  - 隐藏streak
  - 记录repair
  - 降低负担
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.parent-access
  title: 家长要求看青少年全部私人记录
  audience:
  - parent
  - older_teen
  - teacher
  trigger: 家庭共享请求扩大到私人日记。
  formation_tension: 保护与隐私之间。
  safe_outcomes:
  - 限定共享摘要
  - 安全例外透明
  - 不复制日记
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.spouse-score
  title: 配偶想查看关系分数
  audience:
  - adult
  trigger: 系统拟生成婚姻质量分。
  formation_tension: 关系帮助与量化支配之间。
  safe_outcomes:
  - 粗粒度果子
  - 双方同意
  - 无总分
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.teacher-label
  title: 教师把缺席解释为不敬虔
  audience:
  - teacher
  trigger: 观察记录产生属灵判断。
  formation_tension: 观察与越权解释之间。
  safe_outcomes:
  - 可观察事实
  - 人工纠正
  - 不推断
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.attention-telemetry
  title: 接入完整手机遥测
  audience:
  - teacher
  trigger: 团队提议自动读取所有App时长。
  formation_tension: 便利与数据最小化之间。
  safe_outcomes:
  - 拒绝原始遥测
  - 用户实践信号
  - 同意
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.auto-notify-pastor
  title: 系统自动通知牧者
  audience:
  - adult
  - teacher
  trigger: 模型发现“风险模式”后准备自动发送。
  formation_tension: 支持与隐私/误报之间。
  safe_outcomes:
  - 用户决定
  - S2/S3除外
  - 最小信息
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.calling
  title: 系统根据服事记录推荐呼召
  audience:
  - adult
  trigger: Twin宣布用户应当全职服事。
  formation_tension: 建议与神谕/教会责任之间。
  safe_outcomes:
  - 禁止呼召结论
  - 提供反思
  - 真人共同体
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.minor-retention
  title: 儿童数据无限保留
  audience:
  - parent
  - teacher
  trigger: 为了未来分析保留全部童年记录。
  formation_tension: 研究价值与儿童权利之间。
  safe_outcomes:
  - 最短保留
  - 聚合删除
  - 不作成年画像
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.delete-request
  title: 删除请求遇到安全审计例外
  audience:
  - adult
  - parent
  trigger: 部分安全审计记录不能立即删除。
  formation_tension: 数据权利与保护审计之间。
  safe_outcomes:
  - 透明说明
  - 删除其他范围
  - 期限和申诉
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.model-invents-event
  title: 模型从文本推断未发生行为
  audience:
  - teacher
  trigger: LLM把含糊句子变成“已失败”。
  formation_tension: 智能与事实来源之间。
  safe_outcomes:
  - 拒绝推断事件
  - 请求用户确认
  - 记录来源
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.twin.cross-user-ranking
  title: 教会想给家庭排名
  audience:
  - teacher
  - parent
  trigger: 管理端想展示最敬虔家庭榜。
  formation_tension: 治理与属灵比较之间。
  safe_outcomes:
  - 禁止排名
  - 聚合项目健康
  - 非个人指标
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
