schema_version: 1.0.0
batch: 8
allowed_events:
- youth_track_viewed
- question_session_started
- autonomy_plan_created
- mentor_plan_reviewed
- readiness_domain_updated
- safety_gate_invoked
allowed_dimensions:
- tenant_id_pseudonymous
- module_key
- batch
- route_key
- age_band_coarse
- content_version
- review_state
- safety_level_coarse
- feature_flag_variant
- completion_state
- error_code_non_sensitive
denylisted_fields:
- assignment_body
- confession
- contact_details
- exact_message_content
- explicit_content
- full_browsing_history
- health_detail
- mentor_contact
- minor_identity
- parent_youth_message
- pastoral_narrative
- post_history
- precise_location
- private_reflection
- question_free_text
- raw_ai_answer
- raw_prompt
- sexual_history
- sexuality_detail
- third_party_identity
rules:
- analytics must be allowlist-based
- S2/S3 narratives never enter product analytics
- free text requires redaction or is excluded
- minor events use coarse age bands and pseudonymous identifiers only
