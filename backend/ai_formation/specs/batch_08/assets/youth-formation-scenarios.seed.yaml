scenario_set_id: ai-formation.youth-scenarios.v1
version: 1.0.0
scenarios:
- id: scenario.youth.college-pressure
  title: 升学压力与价值崩塌
  audience:
  - younger_teen
  - older_teen
  - parent
  trigger: 一次考试失败后认为人生结束。
  formation_tension: 责任与身份价值之间。
  safe_outcomes:
  - 稳定关系
  - 事实化计划
  - 成人支持
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.youth.faith-doubt
  title: 公开表达信仰怀疑
  audience:
  - younger_teen
  - older_teen
  - parent
  - teacher
  trigger: 青少年说自己不确定是否相信。
  formation_tension: 真理与表演性确定之间。
  safe_outcomes:
