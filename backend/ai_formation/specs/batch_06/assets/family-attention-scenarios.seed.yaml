scenario_set_id: ai-formation.family-attention-scenarios.v1
version: 1.0.0
scenarios:
- id: scenario.family.meal-phone
  title: 饭桌持续看手机
  audience:
  - parent
  - elementary
  - younger_teen
  - older_teen
  trigger: 成人和孩子都在饭桌看设备。
  formation_tension: 共同规则与成人榜样之间。
  safe_outcomes:
  - 全员共同规则
  - 公共放置
  - 例外可见
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.family.bedroom-device
  title: 卧室深夜使用
  audience:
  - parent
  - younger_teen
  - older_teen
  trigger: 孩子深夜使用设备并影响睡眠。
  formation_tension: 隐私、发展和保护之间。
  safe_outcomes:
  - 透明夜间规则
  - 公共充电
  - 逐步自治
  prohibited_content:
  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
