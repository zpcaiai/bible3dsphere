  - 不得生成羞辱、定罪、诊断或隐藏监控建议
  review_status: pastoral_review
- id: scenario.family.parent-double-standard
  title: 父母自己不守规则
  audience:
  - parent
  trigger: 父母要求孩子不用手机，自己不停刷消息。
  formation_tension: 权柄与榜样一致之间。
  safe_outcomes:
  - 父母认错
