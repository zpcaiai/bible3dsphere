catalog_id: ai-formation.identity-intimacy-practices.v1
version: 1.0.0
review_status: theology_review
practices:
- id: identity.received-before-performed
  domain: IDENTITY
  title: 先领受身份，再谈表现
  summary: 把价值从外貌、成就、恋爱、流量或属灵表现中移回在基督里所领受的身份。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 写下一句不依赖表现的身份陈述。
  full_practice: 列出三个表现压力，并为每个压力选择一个不靠证明自己的行动。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - EPH_1_3_14
  - COL_3_1_4
- id: identity.comparison-fast
