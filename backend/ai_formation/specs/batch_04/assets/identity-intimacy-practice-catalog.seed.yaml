- id: safety.coercion-stop-and-tell
  domain: SAFETY
  title: 强迫或剥削：停止并求助
  summary: 强迫、威胁、勒索、成人与未成年人不当接触需要保护流程。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 停止普通课程，选择可信成人或保护渠道。
  full_practice: 按既有S2/S3政策最小化记录并人工处理。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - PS_82_3_4
- id: safety.nonconsensual-imagery
  domain: SAFETY
  title: 未经同意影像安全门
  summary: 不要求上传、查看或证明影像内容。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 记录类别而不记录材料。
  full_practice: 引导保存必要法律证据的本地专业建议，而不是上传产品。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - PROV_31_8_9
- id: integration.rule-of-life
  domain: INTEGRATION
  title: 整合为可执行生活规则
  summary: 把身份、欲望、设备、支持和关系责任整合。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 选择三条规则。
  full_practice: 形成7/14/30/90天计划并设复盘点。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - ROM_13_13_14
- id: integration.grace-and-truth-review
  domain: INTEGRATION
  title: 恩典与真理复盘
  summary: 既不纵容也不以羞耻驱动。
  age_bands:
  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 回答：真理要求什么？恩典怎样让我回来？
  full_practice: 记录一个保留、一个改变、一个求助。
  guardrails:
  - 不得把操练表现转化为救恩、成熟或价值评分
  scripture_anchors:
  - JOHN_1_14_17
