  - adult
  - parent
  - teacher
  authority_level: PASTORAL_WISDOM
  review_status: theology_review
  minimum_action: 暂停一个比较性输入24小时。
  full_practice: 完成一次输入审计，并用真实关系、运动或服事替代。
