<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d7cff" />
    <script>
      // 每次访问自动清除本网站的 Service Worker 和缓存
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) {
              if (r.scope && r.scope.includes(window.location.hostname)) {
                r.unregister();
                console.log('[cache-clear] ServiceWorker unregistered:', r.scope);
              }
            });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              caches.delete(name);
              console.log('[cache-clear] Cache deleted:', name);
            });
          });
        }
      })();
    </script>
