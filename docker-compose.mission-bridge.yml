services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mission_bridge
      POSTGRES_USER: mission_bridge
      POSTGRES_PASSWORD: mission_bridge_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission_bridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mission_bridge_pg:/var/lib/postgresql/data
    networks: [database]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mission_bridge:mission_bridge_local_only@postgres:5432/mission_bridge
      JWT_SECRET_KEY: local-development-secret-change-before-deploy
      ALLOWED_ORIGINS: http://localhost:5173
      AGENT_MODE: mock
      OTEL_SERVICE_NAME: mission-bridge-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:7860"]
    networks: [database, edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["python", "-m", "backend.mission_bridge_worker"]
    environment:
      DATABASE_URL: postgresql://mission_bridge:mission_bridge_local_only@postgres:5432/mission_bridge
      MISSION_BRIDGE_WORKER_INTERVAL: "60"
      OTEL_SERVICE_NAME: mission-bridge-worker
    depends_on:
      api:
        condition: service_healthy
    networks: [database]

  web:
    build:
      context: ../bible3dsphereWeb
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  mission_bridge_pg:
networks:
  database:
    internal: true
  edge:
