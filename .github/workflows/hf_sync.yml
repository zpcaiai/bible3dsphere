name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Git
        run: |
          git config --global user.email "zpchoney@gmail.com"
          git config --global user.name "Stephen Zao"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          echo "Adding Hugging Face remote..."
          git remote add hf https://StephenZao:$HF_TOKEN@huggingface.co/spaces/StephenZao/biblesphere 2>/dev/null || true
          echo "Pushing to Hugging Face..."
          git push --force hf main
          echo "Sync completed!"