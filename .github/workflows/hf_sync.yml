name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-neon:
    name: Apply strict Neon migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (tip only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration gate dependencies
        run: >-
          python -m pip install
          'psycopg2-binary>=2.9.0,<2.10.0'
          'pytest>=7.4.0,<9.0.0'

      - name: Test strict migration gate
        run: >-
          python -m pytest --noconftest -q -p no:cacheprovider
          backend/tests/test_migrations.py

      - name: Apply pending migrations to Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error title=Missing Neon secret::Configure repository secret NEON_DATABASE_URL."
            exit 1
          fi
          python -m backend.core.migrations --strict

  sync-to-hf:
    needs: migrate-neon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (tip only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false   # LFS 对象已在 HF；工作区保留指针文本即可

      - name: Verify LFS pointers are intact
        run: |
          size=$(git cat-file -s HEAD:bible_bilingual_metadata.pkl 2>/dev/null || echo 0)
          echo "pkl blob size: $size bytes"
          if [ "$size" -gt 1000 ]; then
            echo "ERROR: pkl stored as raw blob — not an LFS pointer!"
            exit 1
          fi
          echo "✓ LFS pointer OK"

      - name: Guard - no oversize or raw-binary blobs in tree
        run: |
          big=$(git ls-tree -r -l HEAD | awk '$4 > 10485760 {print $4, $5}')
          if [ -n "$big" ]; then
            echo "ERROR: tree contains files over 10MiB (HF会拒收):"
            echo "$big"
            exit 1
          fi
          # HF 要求 mp3/mp4 等二进制走 LFS/Xet；>1KB 的此类裸 blob 会被拒（LFS指针约130B可通过）
          rawbin=$(git ls-tree -r -l HEAD | awk '$4 > 1000 {print $4, $5}' | grep -Ei '\.(mp3|mp4|wav|m4a|ogg|flac|mov|avi|epub|zip|7z|tar|gz|pkl|npy|pt|pth|bin|sqlite|h5)$' || true)
          if [ -n "$rawbin" ]; then
            echo "ERROR: tree contains raw binary files (HF要求LFS/Xet, 请移到R2或转LFS):"
            echo "$rawbin"
            exit 1
          fi
          echo "✓ tree clean (<10MiB 且无裸二进制)"

      - name: Push snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          set -e
          git config user.email "zpchoney@gmail.com"
          git config user.name "Stephen Zao"
          # 用当前代码树做一个无历史的快照提交（GitHub 历史中的大对象不会被带上）
          git checkout --orphan hf-snapshot
          git add -A
          git commit -m "Deploy snapshot ${GITHUB_SHA::8}"
          git remote add hf "https://StephenZao:${HF_TOKEN}@huggingface.co/spaces/StephenZao/biblesphere" 2>/dev/null || \
            git remote set-url hf "https://StephenZao:${HF_TOKEN}@huggingface.co/spaces/StephenZao/biblesphere"
          echo "Pushing snapshot to Hugging Face..."
          git push --force hf hf-snapshot:main
          echo "✓ Sync completed!"
