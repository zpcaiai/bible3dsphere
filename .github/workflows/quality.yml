name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic

      - name: Compile core scripts
        run: |
          python -m py_compile \
            backend/core/config.py \
            backend/core/migrations.py \
            backend/core/deps.py \
            backend/mvfe/core/formation.py \
            backend/mvfe/core/reflection.py \
            backend/mvfe/core/orchestrator.py \
            backend/mvfe/core/governance.py \
            backend/routers/stats.py \
            backend/routers/verse.py \
            backend/routers/journal.py \
            backend/routers/prayer.py \
            scripts/artifact_manifest.py \
            scripts/retrieval_pipeline.py \
            evaluation/run_retrieval_eval.py

      - name: Run isolated tests
        run: |
          python -m pytest \
            evaluation \
            backend/core/test_security.py \
            backend/mvfe/core/test_governance.py \
            backend/mvfe/core/test_formation_ema.py \
            backend/mvfe/core/test_parallel_orchestrator.py \
            -q

  frontend-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emotion-sphere-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: emotion-sphere-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: emotion-sphere-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: emotion-sphere-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
