name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic numpy requests psycopg2-binary

      - name: Compile core scripts
        run: |
          python -m py_compile \
            backend/core/config.py \
            backend/core/migrations.py \
            backend/core/deps.py \
            backend/mvfe/core/formation.py \
            backend/mvfe/core/reflection.py \
            backend/mvfe/core/orchestrator.py \
            backend/mvfe/core/postgres_graph.py \
            backend/mvfe/db/graph_schema.py \
            backend/mvfe/core/governance.py \
            backend/mvfe/metrics.py \
            backend/routers/stats.py \
            backend/routers/verse.py \
            backend/routers/journal.py \
            backend/routers/prayer.py \
            backend/graph_layer.py \
            backend/graph_reasoning_engine.py \
            backend/graph_rag.py \
            backend/graph_health.py \
            backend/formation_pipeline.py \
            backend/formation_twin/formation_graph.py \
            backend/formation_twin/temporal_graph.py \
            backend/decision_support.py \
            backend/routers/mvfe_stats.py \
            backend/gift_calling_engine.py \
            backend/routers/gift_calling.py \
            backend/core/tenancy.py \
            backend/routers/org_console.py \
            backend/routers/billing.py \
            backend/routers/platform_admin.py \
            backend/routers/ai_tutor.py \
            backend/routers/spiritual_memory.py \
            backend/routers/analytics.py \
            backend/routers/accountability_group.py \
            backend/routers/mentor.py \
            backend/routers/discipleship.py \
            backend/routers/church_integration.py \
            scripts/artifact_manifest.py \
            scripts/retrieval_pipeline.py \
            evaluation/run_retrieval_eval.py \
            evaluation/ablation_study.py

      - name: Run isolated tests
        run: |
          python -m pytest \
            evaluation \
            backend/core/test_security.py \
            backend/mvfe/core/test_governance.py \
            backend/mvfe/core/test_formation_ema.py \
            backend/mvfe/core/test_parallel_orchestrator.py \
            backend/test_telemetry.py \
            backend/test_preference_vector.py \
            -q

      - name: Gift & Calling OS tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_gift_calling_engine.py \
            tests/test_gift_calling_router.py
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_route_contracts.py -k gift_calling

      - name: PostgreSQL graph, GraphRAG, and governance tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_graph_postgres.py \
            tests/test_graph_rag.py \
            tests/test_graph_health.py

      - name: Org-console tenancy contract tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_org_console_contracts.py tests/test_church_checkin_org_contracts.py tests/test_billing_webhook_contracts.py tests/test_platform_admin_contracts.py

      - name: B12 multi-tenant isolation smoke (no DB)
        run: |
          cd backend
          python b12_smoke.py

      - name: MissionBridge safety and route contracts
        run: |
          python -m py_compile backend/routers/mission_bridge.py backend/mission_bridge_worker.py
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_mission_bridge_contract.py

      - name: Migration ordering check
        run: |
          python - <<'PY'
          from backend.core.migrations import _migration_files
          files = _migration_files()
          assert files == sorted(files)
          assert any(p.name == '0151_mission_bridge.sql' for p in files)
          assert any(p.name == '0221_unify_graph_on_postgres.sql' for p in files)
          PY

      - name: Batch 10 production governance safety gate
        run: |
          PYTHONPATH=backend python -m pytest -q -p no:cacheprovider \
            backend/tests/test_spiritual_planet_platform.py \
            backend/tests/test_spiritual_planet_production_governance.py
          PYTHONPATH=backend python backend/scripts/governance_release_gate.py
          PYTHONPATH=backend python backend/scripts/governance_load_benchmark.py --iterations 1000

  eval-regression:
    name: Retrieval eval regression (no API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Score saved results
        run: |
          python evaluation/run_retrieval_eval.py \
            --cases evaluation/retrieval_cases.json \
            --results-file evaluation/saved_results.json \
            --output evaluation/reports/retrieval_eval_latest.json \
            --top-k 10 \
            --min-mrr 0.45

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: evaluation/reports/retrieval_eval_latest.json
