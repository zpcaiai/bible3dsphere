name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  livekit-worker-image:
    name: Real isolated LiveKit Worker entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual dedicated Worker image
        run: docker build -f Dockerfile.livekit-agent -t digital-human-worker:${{ github.sha }} .
      - name: Exercise configured image entrypoint without network or credentials
        run: python3 backend/scripts/verify_livekit_worker_image.py digital-human-worker:${{ github.sha }}

  python-quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip
          'pytest>=7.4.0,<9.0.0'
          'fastapi==0.115.6'
          'pydantic>=2.10.0,<3.0.0'
          'httpx>=0.27.0,<0.29.0'
          'jsonschema>=4.20.0,<5.0.0'
          'PyYAML>=6.0.2,<7.0.0'
          'cryptography>=42.0.0,<46.0.0'
          'opentelemetry-sdk>=1.24.0,<2.0.0'
          numpy requests psycopg2-binary 'uvicorn[standard]==0.32.1'

      - name: Verify real readiness integration runtimes
        run: |
          python -c 'import uvicorn, psycopg2; print("Real HTTP and PostgreSQL drivers available")'
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          test -x "$pg_bin/postgres"
          "$pg_bin/postgres" --version

      - name: Digital-human integrity, citation and context regressions (no provider)
        run: |
          PYTHONPATH=backend python -m pytest --noconftest -q -p no:cacheprovider \
            backend/tests/test_digital_human_file_integrity.py \
            backend/tests/test_digital_human_topic_matching.py \
            backend/tests/test_digital_human_context.py \
            backend/tests/test_digital_human_scripture.py

      - name: Compile core scripts
        run: |
          python -m py_compile \
            backend/core/config.py \
            backend/core/migrations.py \
            backend/core/deps.py \
            backend/ai_formation/catalog.py \
            backend/ai_formation/content_audit.py \
            backend/ai_formation/contracts.py \
            backend/ai_formation/policy.py \
            backend/ai_formation/spec_registry.py \
            backend/mvfe/core/formation.py \
            backend/mvfe/core/reflection.py \
            backend/mvfe/core/orchestrator.py \
            backend/mvfe/core/postgres_graph.py \
            backend/mvfe/db/graph_schema.py \
            backend/mvfe/core/governance.py \
            backend/mvfe/metrics.py \
            backend/routers/stats.py \
            backend/routers/verse.py \
            backend/routers/journal.py \
            backend/routers/prayer.py \
            backend/mccheyne_push.py \
            backend/graph_layer.py \
            backend/graph_reasoning_engine.py \
            backend/graph_rag.py \
            backend/graph_health.py \
            backend/formation_pipeline.py \
            backend/formation_twin/formation_graph.py \
            backend/formation_twin/temporal_graph.py \
            backend/decision_support.py \
            backend/routers/push.py \
            backend/routers/admin_content.py \
            backend/routers/mvfe_stats.py \
            backend/gift_calling_engine.py \
            backend/routers/gift_calling.py \
            backend/core/tenancy.py \
            backend/routers/org_console.py \
            backend/routers/billing.py \
            backend/routers/platform_admin.py \
            backend/routers/ai_tutor.py \
            backend/routers/spiritual_memory.py \
            backend/routers/ai_formation.py \
            backend/routers/analytics.py \
            backend/routers/accountability_group.py \
            backend/routers/mentor.py \
            backend/routers/discipleship.py \
            backend/routers/church_integration.py \
            scripts/artifact_manifest.py \
            scripts/retrieval_pipeline.py \
            evaluation/run_retrieval_eval.py \
            evaluation/ablation_study.py

      - name: Readiness request-stage regressions (real logging and worker contexts)
        env:
          PYTHONPATH: backend
        run: |
          timeout 300 python -u - <<'PY'
          import os, shutil, time
          import pytest
          for sample in range(2):
              if sample:
                  time.sleep(10)
              started = time.monotonic()
              time.sleep(2)
              load = os.getloadavg()[0]
              free = shutil.disk_usage('.').free
              elapsed = time.monotonic() - started
              print({'sample': sample, 'pid': os.getpid(), 'load': load, 'free': free, 'seconds': elapsed}, flush=True)
              assert load <= min(32, 4 * os.cpu_count()) and free >= 2 * 1024**3 and elapsed <= 3
          assert os.getloadavg()[0] <= min(32, 4 * os.cpu_count())
          print({'actual_pytest_pid': os.getpid()}, flush=True)
          raise SystemExit(pytest.main(['--noconftest', '-vv', '-s', '-p', 'no:cacheprovider', 'backend/tests/test_readiness_diagnostics.py']))
          PY

      - name: Readiness log capture privacy and parser tests
        run: PYTHONPATH=backend python -m pytest --noconftest -q -p no:cacheprovider backend/tests/test_readiness_log_capture.py

      - name: Embedding failure log privacy (injected transport errors)
        run: |
          PYTHONPATH=backend python -m pytest --noconftest -q -p no:cacheprovider backend/tests/test_embedding_log_privacy.py

      - name: Real OpenTelemetry SDK spans (no network exporter)
        run: |
          python -c 'from opentelemetry.sdk.trace import TracerProvider'
          PYTHONPATH=backend python -m pytest --noconftest -q -s -p no:cacheprovider backend/test_telemetry.py

      - name: Run isolated tests
        run: |
          python -m pytest \
            evaluation \
            backend/core/test_security.py \
            backend/mvfe/core/test_governance.py \
            backend/mvfe/core/test_formation_ema.py \
            backend/mvfe/core/test_parallel_orchestrator.py \
            backend/test_preference_vector.py \
            -q

      - name: Gift & Calling OS tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_gift_calling_engine.py \
            tests/test_gift_calling_router.py
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_route_contracts.py -k gift_calling

      - name: AI Formation contracts and evidence (no DB)
        run: |
          PYTHONPATH=backend python -m pytest --noconftest -q -p no:cacheprovider \
            backend/tests/test_ai_formation_contracts.py \
            backend/tests/test_ai_formation_evidence.py

      - name: M'Cheyne daily push tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_mccheyne_push.py \
            tests/test_push_fcm.py

      - name: PostgreSQL graph, GraphRAG, and governance tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider \
            tests/test_graph_postgres.py \
            tests/test_graph_rag.py \
            tests/test_graph_health.py

      - name: Org-console tenancy contract tests (no DB)
        run: |
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_org_console_contracts.py tests/test_church_checkin_org_contracts.py tests/test_billing_webhook_contracts.py tests/test_platform_admin_contracts.py

      - name: B12 multi-tenant isolation smoke (no DB)
        run: |
          cd backend
          python b12_smoke.py

      - name: MissionBridge safety and route contracts
        run: |
          python -m py_compile backend/routers/mission_bridge.py backend/mission_bridge_worker.py
          cd backend
          python -m pytest --noconftest -q -p no:cacheprovider tests/test_mission_bridge_contract.py

      - name: Migration ordering check
        run: |
          python - <<'PY'
          from backend.core.migrations import _migration_files
          files = _migration_files()
          assert files == sorted(files)
          assert any(p.name == '0151_mission_bridge.sql' for p in files)
          assert any(p.name == '0221_unify_graph_on_postgres.sql' for p in files)
          assert any(p.name == '0222_mccheyne_daily_push.sql' for p in files)
          PY

      - name: Batch 10 production governance safety gate
        run: |
          PYTHONPATH=backend python -m pytest -q -p no:cacheprovider \
            backend/tests/test_spiritual_planet_platform.py \
            backend/tests/test_spiritual_planet_production_governance.py
          PYTHONPATH=backend python backend/scripts/governance_release_gate.py
          PYTHONPATH=backend python backend/scripts/governance_load_benchmark.py --iterations 1000

      - name: Read only own postdeploy readiness probe stage records
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/readiness-log-capture' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          timeout 10 python -u backend/scripts/capture_readiness_logs.py
          73992c42-6a6e-4f07-9eea-a1cf251fd87b,e427d67d-3962-4811-8c33-ea08ac1e1a7f,827a0c02-8547-446e-9520-51150b096557,75b59d7d-0280-41e9-bbfd-f7f9c1bdd0a4,bdf34277-90fe-48db-8c15-877beaee4c29,f788ca4a-b655-4a3b-8450-2d381edc0b2f
          e427d67d-3962-4811-8c33-ea08ac1e1a7f

  eval-regression:
    name: Retrieval eval regression (no API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Score saved results
        run: |
          python evaluation/run_retrieval_eval.py \
            --cases evaluation/retrieval_cases.json \
            --results-file evaluation/saved_results.json \
            --output evaluation/reports/retrieval_eval_latest.json \
            --top-k 10 \
            --min-mrr 0.45

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: evaluation/reports/retrieval_eval_latest.json
