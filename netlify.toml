# ============================================================
# DEPRECATED. This built the `emotion-sphere-ui` frontend, which
# has moved to the independent repo bible3dsphereWeb. That base
# directory no longer exists here, so this config no longer builds.
# Kept for reference only — deploy the frontend from its own repo.
# ============================================================
[build]
  base = "emotion-sphere-ui"
  command = "npm run build"
  publish = "emotion-sphere-ui/dist"

[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
